<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Three records for one run</title><desc id="desc">One run ID associates the manifest of inputs, the step evaluation history, and the result summary. Connecting lines indicate association, not execution order.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315a63"/></marker></defs>
<rect width="1100" height="300" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" font-size="29" fill="#23383d"><text x="550" y="40" text-anchor="middle" font-weight="bold">ONE RUN</text>
<line x1="550" y1="55" x2="550" y2="90" stroke="#315a63" stroke-width="2.5"/>
<line x1="175" y1="90" x2="925" y2="90" stroke="#315a63" stroke-width="2.5"/>
<line x1="175" y1="90" x2="175" y2="120" stroke="#315a63" stroke-width="2.5"/>
<rect x="15" y="125" width="320" height="105" rx="7" fill="#f2f6f6" stroke="#315a63" stroke-width="2"/>
<text x="175" y="168" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="29">manifest.json</text>
<text x="175" y="206" text-anchor="middle" font-size="26">Experiment inputs</text>
<line x1="550" y1="90" x2="550" y2="120" stroke="#315a63" stroke-width="2.5"/>
<rect x="390" y="125" width="320" height="105" rx="7" fill="#f2f6f6" stroke="#315a63" stroke-width="2"/>
<text x="550" y="168" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="29">steps.jsonl</text>
<text x="550" y="206" text-anchor="middle" font-size="26">Evaluation history</text>
<line x1="925" y1="90" x2="925" y2="120" stroke="#315a63" stroke-width="2.5"/>
<rect x="765" y="125" width="320" height="105" rx="7" fill="#f2f6f6" stroke="#315a63" stroke-width="2"/>
<text x="925" y="168" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="29">result.json</text>
<text x="925" y="206" text-anchor="middle" font-size="26">Selection + summary</text>
<text x="550" y="275" text-anchor="middle" font-size="25">Shared run ID connects the records; these are not execution stages.</text>
</g></svg>
