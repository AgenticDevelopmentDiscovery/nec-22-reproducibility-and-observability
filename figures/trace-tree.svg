<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- root span -->
  <rect x="270" y="10" width="220" height="46" rx="6" fill="#1f4e79" />
  <text x="380" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Root span</text>
  <text x="380" y="46" text-anchor="middle" fill="#e6eef7" font-size="11">agent run: t=0 &#8594; 4.2s</text>

  <!-- connectors down to three children -->
  <line x1="380" y1="56" x2="120" y2="100" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="56" x2="380" y2="100" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="56" x2="640" y2="100" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- child 1: LLM plan -->
  <rect x="20" y="100" width="200" height="50" rx="6" fill="#2e75b6" />
  <text x="120" y="121" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">span: LLM call</text>
  <text x="120" y="137" text-anchor="middle" fill="#e6eef7" font-size="10">"plan"  model=gpt-x  t=0&#8211;0.6s</text>

  <!-- child 2: tool call, has its own child -->
  <rect x="280" y="100" width="200" height="50" rx="6" fill="#2e75b6" />
  <text x="380" y="121" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">span: tool call</text>
  <text x="380" y="137" text-anchor="middle" fill="#e6eef7" font-size="10">search_docs()  t=0.6&#8211;1.1s</text>

  <!-- connector tool -> its output -->
  <line x1="380" y1="150" x2="380" y2="195" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="255" y="195" width="250" height="50" rx="6" fill="#9dc3e6" />
  <text x="380" y="216" text-anchor="middle" fill="#0b2942" font-size="12" font-weight="bold">span attributes</text>
  <text x="380" y="232" text-anchor="middle" fill="#0b2942" font-size="10">query, raw response, doc ids returned</text>

  <!-- child 3: LLM draft -->
  <rect x="540" y="100" width="200" height="50" rx="6" fill="#2e75b6" />
  <text x="640" y="121" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">span: LLM call</text>
  <text x="640" y="137" text-anchor="middle" fill="#e6eef7" font-size="10">"draft reply"  t=1.1&#8211;4.2s</text>

  <!-- caption line explaining nesting -->
  <text x="380" y="280" text-anchor="middle" fill="#333333" font-size="12">Each span carries its own inputs, outputs, timing, and metadata; nesting shows what called what.</text>
</svg>
