<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Verified candidate ancestry</title><desc id="desc">Candidate c001 x is parent of c002 x squared, which is parent of c003 x squared plus one. Candidate c005 is a losing child of c003, and c004 has no candidate parent.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315a63"/></marker></defs>
<rect width="1100" height="230" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" font-size="29" fill="#23383d"><rect x="30" y="20" width="290" height="100" rx="7" fill="#f2f6f6" stroke="#315a63" stroke-width="2"/>
<text x="175" y="60" text-anchor="middle" font-size="26">c001</text>
<text x="175" y="101" text-anchor="middle" font-size="34" font-weight="bold">x</text>
<line x1="330" y1="70" x2="385" y2="70" stroke="#315a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="400" y="20" width="290" height="100" rx="7" fill="#f2f6f6" stroke="#315a63" stroke-width="2"/>
<text x="545" y="60" text-anchor="middle" font-size="26">c002</text>
<text x="545" y="101" text-anchor="middle" font-size="34" font-weight="bold">x²</text>
<line x1="700" y1="70" x2="755" y2="70" stroke="#315a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="770" y="20" width="290" height="100" rx="7" fill="#f2f6f6" stroke="#315a63" stroke-width="2"/>
<text x="915" y="60" text-anchor="middle" font-size="26">c003</text>
<text x="915" y="101" text-anchor="middle" font-size="34" font-weight="bold">x² + 1</text>
<text x="550" y="162" text-anchor="middle" font-size="25">Parent → child: follow parent_candidate_id backward to investigate</text>
<text x="550" y="208" text-anchor="middle" font-size="24">Also recorded: c005 is a losing child of c003; c004 has no candidate parent.</text>
</g></svg>
