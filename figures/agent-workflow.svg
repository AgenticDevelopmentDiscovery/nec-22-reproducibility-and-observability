<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
<title id="title">Python agent execution and recording lifecycle</title>
<desc id="desc">Initialize with five observations and seed 7, saving inputs and source before the search. Propose an equation, evaluate predictions, calculate MSE or retain failure information, update the best valid incumbent, and log the attempt. Feed the incumbent into the next proposal until five attempts are complete. Then save the selected result and finalize run status.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315a63"/></marker></defs>
<rect width="1100" height="350" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#23383d" text-anchor="middle">
<text x="550" y="35" font-size="28">Initialize: five observations, seed 7; save inputs + source</text>
<path d="M112 48 V90" fill="none" stroke="#315a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<g fill="#f2f6f6" stroke="#315a63" stroke-width="2">
<rect x="15" y="100" width="195" height="95" rx="7"/>
<rect x="235" y="100" width="195" height="95" rx="7"/>
<rect x="455" y="100" width="195" height="95" rx="7"/>
<rect x="675" y="100" width="195" height="95" rx="7"/>
<rect x="895" y="100" width="190" height="95" rx="7"/>
</g>
<g font-size="29" font-weight="bold">
<text x="112" y="138">Propose</text><text x="332" y="138">Evaluate</text><text x="552" y="138">Score</text><text x="772" y="138">Keep best</text><text x="990" y="138">Log</text>
</g>
<g font-size="25">
<text x="112" y="176">equation</text><text x="332" y="176">predictions</text><text x="552" y="176">MSE / failure</text><text x="772" y="176">if improved</text><text x="990" y="176">each attempt</text>
</g>
<g fill="none" stroke="#315a63" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M213 147 H230"/><path d="M433 147 H450"/><path d="M653 147 H670"/><path d="M873 147 H890"/>
<path d="M990 200 V235 H112 V202"/>
</g>
<text x="550" y="275" font-size="26">Best valid equation feeds the next proposal; stop after five attempts.</text>
<text x="550" y="332" font-size="28">Finish: save the selected result and finalize run status</text>
</g></svg>
