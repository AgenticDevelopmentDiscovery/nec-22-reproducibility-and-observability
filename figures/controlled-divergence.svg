<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
<title id="title">Original versus modified experiment</title><desc id="desc">The target at x minus two changes from five to six. The first score changes from 13.8 to 16.8, and the same winner changes from zero to 0.2 MSE. First divergence is at step one.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315a63"/></marker></defs>
<rect width="1100" height="320" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" font-size="29" fill="#23383d"><text x="640" y="40" text-anchor="middle" font-weight="bold">Original</text>
<text x="940" y="40" text-anchor="middle" font-weight="bold">Modified</text>
<text x="25" y="100" >Target at x = −2</text>
<text x="640" y="100" text-anchor="middle">5</text>
<text x="940" y="100" text-anchor="middle">6</text>
<text x="25" y="165" >Step 1: MSE of x</text>
<text x="640" y="165" text-anchor="middle">13.8</text>
<text x="940" y="165" text-anchor="middle">16.8</text>
<text x="25" y="230" >Winner: MSE of x² + 1</text>
<text x="640" y="230" text-anchor="middle">0.0</text>
<text x="940" y="230" text-anchor="middle">0.2</text>
<line x1="10" y1="125" x2="1080" y2="125" stroke="#315a63" stroke-width="2.5"/>
<text x="550" y="295" text-anchor="middle" font-weight="bold">First divergence: step 1, input hash and score</text>
</g></svg>
